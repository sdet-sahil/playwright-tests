
name: Playwright Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Select the environment to run tests against
        required: true
        default: prod
        type: choice
        options:
          - qa
          - staging
          - prod

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Get the installed Playwright version for browser caching
      - name: Get Playwright Version
        id: playwright-version
        run: |
          VERSION=$(npx playwright --version | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Install browser binaries and OS dependencies
      - name: Install Playwright OS Dependencies
        run: npx playwright install-deps

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install

      # Run tests while allowing reporting and notifications to continue
      - name: Run Playwright Tests
        id: run-tests
        continue-on-error: true
        run: npx playwright test
        env:
          TEST_ENV: ${{ github.event.inputs.environment || 'prod' }}

      # Parse Playwright JSON report metrics
      - name: Parse Test Metrics
        id: parse-metrics
        if: always()
        shell: bash
        run: |
          JSON_PATH="playwright-report/results.json"

          if [ ! -f "$JSON_PATH" ]; then
            echo "JSON report not found at $JSON_PATH"
            echo "TOTAL=0" >> "$GITHUB_OUTPUT"
            echo "PASSED=0" >> "$GITHUB_OUTPUT"
            echo "FAILED=0" >> "$GITHUB_OUTPUT"
            echo "FLAKY=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL=$(jq -r \
            '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' \
            "$JSON_PATH")
          PASSED=$(jq -r '.stats.expected' "$JSON_PATH")
          FAILED=$(jq -r '.stats.unexpected' "$JSON_PATH")
          FLAKY=$(jq -r '.stats.flaky' "$JSON_PATH")

          echo "TOTAL=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "PASSED=$PASSED" >> "$GITHUB_OUTPUT"
          echo "FAILED=$FAILED" >> "$GITHUB_OUTPUT"
          echo "FLAKY=$FLAKY" >> "$GITHUB_OUTPUT"

      # Upload the report even when tests fail
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      # Slack success notification
      - name: Send Slack Notification on Success
        if: always() && steps.run-tests.outcome == 'success'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.PLAYWRIGHT_CHANNEL_URL }}
          SLACK_CHANNEL: testing-alerts
          SLACK_COLOR: '#00FF00'
          SLACK_ICON: https://playwright.dev
          SLACK_TITLE: 'Playwright Execution Passed!'
          SLACK_MESSAGE: |
            *Environment:* `${{ github.event.inputs.environment || 'prod' }}`
            *Total Tests:* `${{ steps.parse-metrics.outputs.TOTAL }}`
            *Passed:* `${{ steps.parse-metrics.outputs.PASSED }}`
            *Failed:* `${{ steps.parse-metrics.outputs.FAILED }}`
            *Flaky:* `${{ steps.parse-metrics.outputs.FLAKY }}`
            *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_USERNAME: Playwright Bot

      # Slack failure notification
      - name: Send Slack Notification on Failure
        if: always() && steps.run-tests.outcome == 'failure'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.PLAYWRIGHT_CHANNEL_URL }}
          SLACK_CHANNEL: testing-alerts
          SLACK_COLOR: '#FF0000'
          SLACK_ICON: https://playwright.dev
          SLACK_TITLE: 'Playwright Execution Failed!'
          SLACK_MESSAGE: |
            *Environment:* `${{ github.event.inputs.environment || 'prod' }}`
            *Total Tests:* `${{ steps.parse-metrics.outputs.TOTAL }}`
            *Passed:* `${{ steps.parse-metrics.outputs.PASSED }}`
            *Failed:* `${{ steps.parse-metrics.outputs.FAILED }}`
            *Flaky:* `${{ steps.parse-metrics.outputs.FLAKY }}`
            
            Download the playwright-report artifact from:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_USERNAME: Playwright Bot

      # Restore the failure exit code after reporting
      - name: Enforce Pipeline Exit Code
        if: always() && steps.run-tests.outcome == 'failure'
        run: exit 1