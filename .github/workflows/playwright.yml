# .github/workflows/playwright.yml
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to run tests against'
        required: true
        default: 'prod'
        type: choice
        options:
          - qa
          - staging
          - prod


jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. Setup Node and restore npm cache
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # 2. Manage browser binary cache
    - name: Get Playwright Version for Cache Key
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright Browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    # 3. Handle system dependencies & browser installs
    - name: Install Playwright OS Dependencies
      run: npx playwright install-deps

    - name: Install Playwright Browsers (On Cache Miss)
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: npx playwright install

    # 4. Run tests
    - name: Run Playwright tests
      run: npx playwright test
      env: 
        TEST_ENV: ${{ github.event.inputs.environment || 'prod' }}

    # 5. ALWAYS SAVE THE HTML REPORT TO GITHUB ARTIFACTS (Runs even if tests fail)
    - name: Upload Playwright HTML Report
      if: always() # 👈 Crucial: This ensures logs are saved even if a test breaks
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # ==========================================
    # SLACK WEBHOOK NOTIFICATIONS
    # ==========================================

    # 🟢 Slack Success Alert
    - name: Send Slack Notification on Success
      if: success() && (github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch')
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.PLAYWRIGHT_CHANNEL_URL }}
        SLACK_CHANNEL: 'testing-alerts'
        SLACK_COLOR: '#00FF00'
        SLACK_ICON: 'https://playwright.dev'
        SLACK_TITLE: '✅ Playwright Test Successful!'
        SLACK_MESSAGE: 'All automated end-to-end tests passed cleanly against the browser engines in [${{ github.event.inputs.environment || "prod" }}]!\nView Run: https://github.com${{ github.repository }}/actions/runs/${{ github.run_id }}'
        SLACK_USERNAME: 'Playwright Bot'

    # 🔴 Slack Failure Alert (Includes link to find the HTML report artifact)
    - name: Send Slack Notification on Failure
      if: failure() && (github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch')
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.PLAYWRIGHT_CHANNEL_URL }}
        SLACK_CHANNEL: 'testing-alerts'
        SLACK_COLOR: '#FF0000'
        SLACK_ICON: 'https://playwright.dev'
        SLACK_TITLE: '🚨 Playwright Test Failed!'
        # 🔗 The line below dynamically links directly to the specific execution run where the downloadable artifact is stored
        SLACK_MESSAGE:  'The Playwright test suite broke in [${{ github.event.inputs.environment || "prod" }}]. Please check the logs and download the HTML Report artifact here:\n👉 https://github.com${{ github.repository }}/actions/runs/${{ github.run_id }}'
        SLACK_USERNAME: 'Playwright Bot'
