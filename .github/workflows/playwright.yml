# .github/workflows/playwright.yml
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 👈 1. This enables the manual "Run Workflow" button in GitHub Actions

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. Setup Node and restore the npm global package cache
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    # 2. Extract and unzip packages directly from local npm cache to node_modules/
    - name: Install dependencies
      run: npm ci

    # 3. Pull the exact Playwright version number to construct a deterministic cache key
    - name: Get Playwright Version for Cache Key
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    # 4. Search and restore the large browser binary cache folder (~/.cache/ms-playwright)
    - name: Cache Playwright Browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    # 5. Install required Linux system dependencies (takes ~5-10 seconds)
    - name: Install Playwright OS Dependencies
      run: npx playwright install-deps

    # 6. Only download browser binaries if the cache missed (skipped on cache hit)
    - name: Install Playwright Browsers (On Cache Miss)
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: npx playwright install

    # 7. Execute the end-to-end automation test suite
    - name: Run Playwright tests
      run: npx playwright test

    # ==========================================
    # SLACK WEBHOOK NOTIFICATIONS
    # ==========================================

    # 🟢 Slack Success Alert (Fires if tests passed AND it was a Dependabot PR OR manual trigger)
    - name: Send Slack Notification on Success
      if: success() && (github.actor == 'dependabot[bot]' || github.event_name == 'push')
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.PLAYWRIGHT_CHANNEL_URL }}
        SLACK_CHANNEL: 'testing-alerts'
        SLACK_COLOR: '#00FF00'
        SLACK_ICON: 'https://playwright.dev'
        SLACK_TITLE: '✅ Playwright Upgrade/Test Successful!'
        SLACK_MESSAGE: 'All automated end-to-end tests passed cleanly against the browser engines!'
        SLACK_USERNAME: 'Playwright Bot'

    # 🔴 Slack Failure Alert (Fires if tests failed AND it was a Dependabot PR OR manual trigger)
    - name: Send Slack Notification on Failure
      if: failure() && (github.actor == 'dependabot[bot]' || github.event_name == 'push')
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.PLAYWRIGHT_CHANNEL_URL }}
        SLACK_CHANNEL: 'testing-alerts'
        SLACK_COLOR: '#FF0000'
        SLACK_ICON: 'https://playwright.dev'
        SLACK_TITLE: '🚨 Playwright Upgrade/Test Failed!'
        SLACK_MESSAGE: 'The Playwright test suite broke or encountered an error. Review the logs before merging.'
        SLACK_USERNAME: 'Playwright Bot'
